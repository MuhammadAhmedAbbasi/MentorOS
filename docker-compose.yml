services:
  db:
    image: pgvector/pgvector:pg16
    container_name: mentoros_db
    environment:
      POSTGRES_USER: mentoros
      POSTGRES_PASSWORD: mentoros
      POSTGRES_DB: mentoros
    ports:
      # Host port 5433 avoids clashing with a native PostgreSQL on 5432.
      # Override with POSTGRES_HOST_PORT if needed.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - mentoros_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mentoros -d mentoros"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mentoros_pgdata:
